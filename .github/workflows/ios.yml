name: MindDesk fürs iPhone bauen

# Baut die native Hülle auf einem Mac und startet sie im iPhone-Simulator.
# Bestanden heißt: Die Oberfläche ist in der App geladen und die Brücke zum iPhone antwortet.
# Läuft nur auf Knopfdruck (Actions › „iPhone-App bauen" › Run workflow), weil Mac-Rechenzeit
# knapp ist: Die Simulator-Befehle brauchen dort jeweils mehrere Minuten, ein Lauf rund 12–15.
on:
  workflow_dispatch:

permissions:
  contents: read

# Ein neuer Push bricht den noch laufenden Bau desselben Zweigs ab (spart Rechenzeit).
concurrency:
  group: gedanken-ios-${{ github.ref }}
  cancel-in-progress: true

jobs:
  bauen:
    runs-on: macos-26
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Xcode-Version
        run: xcodebuild -version

      - name: Für den Simulator bauen
        run: |
          set -o pipefail
          xcodebuild -project ios/Gedanken.xcodeproj -target Gedanken -configuration Debug \
            -sdk iphonesimulator CODE_SIGNING_ALLOWED=NO ONLY_ACTIVE_ARCH=NO SYMROOT="$PWD/build" build \
            | grep -E "error|warning: unre|BUILD|\.swift:[0-9]+" | tail -n 120

      - name: Paketinhalt prüfen
        run: |
          APP=build/Debug-iphonesimulator/Gedanken.app
          ls "$APP" "$APP/web" "$APP/web/src"
          test -f "$APP/web/index.html" && test -f "$APP/web/src/app.js" && test -f "$APP/web/src/core.js"
          for KEY in NSMicrophoneUsageDescription NSSpeechRecognitionUsageDescription NSCalendarsFullAccessUsageDescription CFBundleDisplayName UILaunchScreen; do
            /usr/libexec/PlistBuddy -c "Print :$KEY" "$APP/Info.plist"
          done

      - name: Im Simulator starten
        timeout-minutes: 25
        run: |
          set -x
          # Ein iPhone der neuesten installierten iOS-Version nehmen (ältere Laufzeiten starten hier nicht zuverlässig).
          DEVICE=$(xcrun simctl list devices available -j | python3 -c "
          import json, sys
          runtimes = json.load(sys.stdin)['devices']
          phones = [(name, d) for name, devs in runtimes.items() if 'iOS' in name for d in devs if d['name'].startswith('iPhone')]
          phones.sort(key=lambda p: ([int(x) for x in p[0].split('iOS-')[-1].split('-') if x.isdigit()], 'Pro Max' not in p[1]['name'], p[1]['name']))
          print(phones[-1][1]['udid'])")
          xcrun simctl list devices available | grep -E "iPhone" | head -n 12
          echo "Boot $(date +%T)"
          xcrun simctl boot "$DEVICE"
          xcrun simctl bootstatus "$DEVICE" -b
          echo "Bereit $(date +%T)"
          xcrun simctl install "$DEVICE" build/Debug-iphonesimulator/Gedanken.app
          xcrun simctl launch "$DEVICE" de.minddesk.app
          DATA=$(xcrun simctl get_app_container "$DEVICE" de.minddesk.app data)
          MARK="$DATA/Library/Application Support/ready.txt"
          for i in $(seq 1 45); do
            if [ -f "$MARK" ]; then break; fi
            sleep 2
          done
          sleep 3
          xcrun simctl io "$DEVICE" screenshot simulator.png || true
          ls -la "$DATA/Library/Application Support" || true
          test -f "$MARK"

      - name: Bildschirmfoto aufheben
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: simulator
          path: simulator.png
          if-no-files-found: ignore
